<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { background: #e29b55; padding: 40px; font-family: 'Fredoka', 'Quicksand', sans-serif; display: flex; gap: 20px; }
.hcb-stamp-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  width: 90px;
}
.hcb-white-card {
  width: 90px;
  height: 90px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(60, 20, 10, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  box-sizing: border-box;
}
.hcb-pink-badge {
  width: 100%;
  height: 100%;
  background: #ea3954;
  border: 2.5px solid #ffccd5;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}
.hcb-bank-svg {
  width: 50px;
  height: 50px;
}
.hcb-stamp-label {
  margin-top: 6px;
  font-size: 18px;
  font-weight: 800;
  color: #ffffff;
  text-shadow: 0 2px 4px rgba(100, 40, 10, 0.6);
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
  <div class="hcb-stamp-unit">
    <div class="hcb-white-card">
      <div class="hcb-pink-badge">
        <svg class="hcb-bank-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Roof -->
          <path d="M12 21L24 11L36 21" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- 3 Columns -->
          <line x1="17" y1="24" x2="17" y2="33" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="24" y1="24" x2="24" y2="33" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="31" y1="24" x2="31" y2="33" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <!-- Base -->
          <line x1="11" y1="37" x2="37" y2="37" stroke="white" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <span class="hcb-stamp-label">HCB</span>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 85" width="100" height="85">
  <defs>
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa94d"/>
      <stop offset="45%" stop-color="#fd7e14"/>
      <stop offset="100%" stop-color="#d9480f"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#99e99a"/>
      <stop offset="100%" stop-color="#51cf66"/>
    </linearGradient>
  </defs>
  <!-- Green Leaves / Foliage Tufts behind -->
  <g id="foliage">
    <ellipse cx="32" cy="28" rx="16" ry="20" transform="rotate(-25, 32, 28)" fill="url(#leafGrad)"/>
    <ellipse cx="50" cy="20" rx="15" ry="22" fill="url(#leafGrad)"/>
    <ellipse cx="68" cy="28" rx="16" ry="20" transform="rotate(25, 68, 28)" fill="url(#leafGrad)"/>
    <!-- Darker depth leaves -->
    <ellipse cx="40" cy="22" rx="10" ry="16" transform="rotate(-10, 40, 22)" fill="#2f9e44" opacity="0.6"/>
    <ellipse cx="60" cy="22" rx="10" ry="16" transform="rotate(10, 60, 22)" fill="#2f9e44" opacity="0.6"/>
  </g>
  <!-- Plump Carrot Shoulder / Top Bulb planted in soil -->
  <g id="bulb">
    <path d="M12,68 C8,45 28,32 50,32 C72,32 92,45 88,68 C86,76 82,85 50,85 C18,85 14,76 12,68 Z" fill="url(#carrotGrad)"/>
    <!-- Soft top highlight -->
    <ellipse cx="45" cy="42" rx="22" ry="6" fill="#ffe066" opacity="0.5" transform="rotate(-6, 45, 42)"/>
    <!-- Subtle horizontal wrinkle grooves -->
    <path d="M26,52 Q45,49 68,54" stroke="#c92a2a" stroke-width="2" stroke-linecap="round" opacity="0.35" fill="none"/>
    <path d="M32,64 Q50,62 74,67" stroke="#c92a2a" stroke-width="2.5" stroke-linecap="round" opacity="0.3" fill="none"/>
  </g>
</svg>
